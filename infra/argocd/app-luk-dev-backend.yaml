apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-luk-dev-backend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/igyan2013/argocd-test-apps.git
    targetRevision: HEAD
    path: luk-dev-backend
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true